[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qafila-lakehouse-capstone"
version = "1.0.0"
description = "Educational Qafila Lakehouse capstone implementation with synthetic source data"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
orchestration = ["dagster>=1.9,<2", "dagster-webserver>=1.9,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
